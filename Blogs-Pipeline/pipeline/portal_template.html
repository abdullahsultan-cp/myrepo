<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AKU Blogs — what we have, what we do not</title>
<style>
:root{
 --bg:#0d1311; --panel:#141b19; --card:#19221f; --card2:#1e2a26; --line:#28342f; --line2:#35443f;
 --ink:#e9f0ed; --mut:#93a49d; --dim:#6b7b75;
 --ok:#4ade80; --okbg:#12271c;
 --get:#fbbf24; --getbg:#2a2110; --getln:#4d3d15;
 --dev:#f87171; --devbg:#2a1616; --devln:#4d2222;
 --you:#60a5fa; --youbg:#141f2e; --youln:#1e3a5c;
 --skip:#94a3b8; --skipbg:#1b2227; --skipln:#33414a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--panel)}
::-webkit-scrollbar-thumb{background:#31413b;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#3d5049}
a{color:#7dd3fc}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 0 0}
.wrap{max-width:1620px;margin:0 auto;padding:0 24px}
h1{margin:0 0 5px;font-size:19px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:12.5px;max-width:980px}

.key{display:grid;grid-template-columns:repeat(auto-fit,minmax(206px,1fr));gap:8px;margin:14px 0 0}
.k{border:1px solid var(--line);border-left:4px solid;border-radius:9px;padding:9px 12px;
 background:var(--card);cursor:pointer;transition:.13s;user-select:none}
.k:hover{background:var(--card2);transform:translateY(-1px)}
.k.sel{box-shadow:0 0 0 2px currentColor inset}
.k b{font-size:12.5px;margin-bottom:1px;display:flex;justify-content:space-between;gap:8px}
.k b i{font-style:normal;opacity:.85}
.k span{color:var(--mut);font-size:11.5px;line-height:1.45;display:block}
.k.ok{border-left-color:var(--ok);color:var(--ok)}     .k.ok b{color:var(--ok)}
.k.get{border-left-color:var(--get);color:var(--get)}  .k.get b{color:var(--get)}
.k.dev{border-left-color:var(--dev);color:var(--dev)}  .k.dev b{color:var(--dev)}
.k.you{border-left-color:var(--you);color:var(--you)}  .k.you b{color:var(--you)}
.k.skip{border-left-color:var(--skip);color:var(--skip)} .k.skip b{color:var(--skip)}

.stats{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 12px;
 min-width:96px;cursor:pointer;transition:.13s;user-select:none}
.stat:hover{background:var(--card2);border-color:var(--line2)}
.stat.sel{border-color:currentColor;box-shadow:0 0 0 1px currentColor inset}
.stat b{display:block;font-size:18px;line-height:1.3}
.stat span{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.stat.bad{color:var(--dev)} .stat.bad b{color:var(--dev)}
.stat.warn{color:var(--get)} .stat.warn b{color:var(--get)}
.stat.good{color:var(--ok)} .stat.good b{color:var(--ok)}

.bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:12px 0 0;padding-bottom:14px}
input,select{font:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--line2);
 border-radius:8px;background:var(--card);color:var(--ink)}
input{min-width:210px} input::placeholder{color:var(--dim)}
select{cursor:pointer;max-width:240px} select option{background:#141b19}
.clear{background:none;border:1px solid var(--line2);color:var(--mut);border-radius:8px;
 padding:7px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.clear:hover{color:var(--ink);border-color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{background:var(--youbg);color:var(--you);border:1px solid var(--youln);border-radius:20px;
 padding:3px 10px;font-size:11.5px;cursor:pointer}
.chip:hover{filter:brightness(1.25)}
.chip em{font-style:normal;opacity:.6}

.layout{display:grid;grid-template-columns:312px 1fr;gap:16px;align-items:start;padding:16px 0 44px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
 max-height:calc(100vh - 60px);overflow-y:auto;position:sticky;top:16px}
.row{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--card)}
.row.on{background:#1b2b25;border-left:3px solid var(--ok);padding-left:9px}
.row .t{font-size:12.5px;font-weight:600;line-height:1.35}
.row .m{color:var(--dim);font-size:10.5px;margin-top:4px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tag{padding:1px 7px;border-radius:20px;font-size:10px;font-weight:700}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.get{background:var(--getbg);color:var(--get)}
.tag.dev{background:var(--devbg);color:var(--dev)}
.tag.you{background:var(--youbg);color:var(--you)}
.tag.skip{background:var(--skipbg);color:var(--skip)}
.tag.cat{background:#1d2a24;color:#8fd3ae;cursor:pointer;font-weight:600}
.tag.cat:hover{filter:brightness(1.3)}

.panel{display:grid;grid-template-columns:minmax(340px,.82fr) 1fr;gap:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px}
.card h2{margin:0 0 6px;font-size:16.5px;line-height:1.35}
.card h3{margin:0 0 11px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.meta{color:var(--mut);font-size:12px;line-height:1.85;margin-bottom:15px;
 padding-bottom:13px;border-bottom:1px solid var(--line)}
.meta code{background:var(--card);border:1px solid var(--line);padding:1px 6px;border-radius:5px;
 font-size:11px;color:var(--ink)}
.lk{cursor:pointer;border-bottom:1px dotted var(--dim)}
.lk:hover{color:var(--ink)}

.b{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:start;
 border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:9px;
 padding:9px 11px;margin-bottom:7px;background:var(--card)}
.b.get{border-left-color:var(--get)} .b.dev{border-left-color:var(--dev)}
.b.you{border-left-color:var(--you)} .b.skip{border-left-color:var(--skip)}
.b .name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:700}
.b .note{font-size:11.5px;color:var(--mut);margin-top:3px;word-break:break-word}
.b .fix{font-size:11px;margin-top:5px;padding-top:5px;border-top:1px dashed var(--line2);color:var(--mut)}
.b .verdict{font-size:9.5px;font-weight:800;letter-spacing:.05em;white-space:nowrap;
 padding:3px 8px;border-radius:20px;align-self:start}
.b.ok  .verdict{background:var(--okbg);color:var(--ok)}
.b.get .verdict{background:var(--getbg);color:var(--get)}
.b.dev .verdict{background:var(--devbg);color:var(--dev)}
.b.you .verdict{background:var(--youbg);color:var(--you)}
.b.skip .verdict{background:var(--skipbg);color:var(--skip)}

.prev{font-size:14px;line-height:1.8;color:#dae4e0}
.prev p{margin:0 0 12px}
.prev h2,.prev h3{margin:19px 0 8px;font-size:15.5px;color:var(--ink);text-transform:none;letter-spacing:0}
.prev ul,.prev ol{margin:0 0 12px;padding-left:21px}
.prev blockquote{margin:14px 0;padding:9px 15px;border-left:3px solid var(--ok);
 background:var(--card);font-style:italic}
.hero{border:1px solid var(--line2);border-radius:9px;padding:20px;text-align:center;
 color:var(--dim);font-size:11.5px;background:var(--card);margin-bottom:13px}
.gap{border:2px dashed var(--devln);background:var(--devbg);border-radius:9px;padding:13px;margin:12px 0}
.gap.get{border-color:var(--getln);background:var(--getbg)}
.gap.you{border-color:var(--youln);background:var(--youbg)}
.gap.skip{border-color:var(--skipln);background:var(--skipbg)}
.gap b{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dev)}
.gap.get b{color:var(--get)} .gap.you b{color:var(--you)} .gap.skip b{color:var(--skip)}
.gap span{display:block;color:var(--mut);font-size:11px;margin-top:4px;word-break:break-all}
.quote{border-left:3px solid var(--ok);padding:12px 17px;margin:15px 0;background:var(--card);
 font-size:15.5px;font-style:italic;border-radius:0 9px 9px 0}
.quote .att{display:block;font-style:normal;font-size:11.5px;color:var(--dim);margin-top:8px}
.empty{padding:40px 20px;text-align:center;color:var(--dim);font-size:13px}

/* real media, shown rather than described */
.img{margin:14px 0;padding:0}
.img img{width:100%;border-radius:9px;display:block;border:1px solid var(--line)}
.img figcaption{color:var(--dim);font-size:11px;margin-top:5px;text-align:center}
.banner img{width:100%;border-radius:9px;display:block;border:1px solid var(--line);margin-bottom:6px}
.vid{position:relative;padding-bottom:56.25%;height:0;margin:14px 0;border-radius:9px;overflow:hidden;
 border:1px solid var(--line)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.embed{margin:14px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.embed iframe{width:100%;min-height:420px;border:0;display:block}

/* tabs */
.tabs{display:flex;gap:4px;margin:12px 0 0}
.tab{padding:7px 14px;border-radius:8px 8px 0 0;border:1px solid var(--line);border-bottom:none;
 background:var(--card);color:var(--mut);cursor:pointer;font-size:13px;font-weight:600}
.tab.on{background:var(--panel);color:var(--ink);border-color:var(--line2)}

/* archive grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px;padding:16px 0 44px}
.gc{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
 cursor:pointer;transition:.14s;display:flex;flex-direction:column}
.gc:hover{border-color:var(--line2);transform:translateY(-2px)}
.gc .thumb{aspect-ratio:16/9;background:var(--card);display:flex;align-items:center;
 justify-content:center;color:var(--dim);font-size:11px;overflow:hidden}
.gc .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.gc .body{padding:11px 13px;flex:1;display:flex;flex-direction:column;gap:6px}
.gc .ti{font-size:13px;font-weight:650;line-height:1.35}
.gc .mm{color:var(--dim);font-size:11px;display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;align-items:center}

/* taxonomy browser */
.taxwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;padding:16px 0 44px}
.taxcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.taxcard h3{margin:0 0 12px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.tl{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:7px;
 cursor:pointer;font-size:12.5px;border:1px solid transparent}
.tl:hover{background:var(--card);border-color:var(--line)}
.tl b{font-weight:600}
.tl i{font-style:normal;color:var(--dim);font-size:11px}
.tl.sel{background:var(--card);border-color:var(--line2)}
.tl .who{color:var(--dim);font-size:10.5px;display:block;margin-top:1px}
@media(max-width:1280px){.layout{grid-template-columns:1fr}.panel{grid-template-columns:1fr}
 .list{position:static;max-height:300px}}
</style></head><body>
<header><div class="wrap">
<h1>AKU Blogs — what we have, what we do not</h1>
<div class="sub">All 83 posts as Storyblok will hold them. Every row is one block; every block gets one
verdict. <strong>Click any card, counter, category or tag to filter.</strong> Nothing is invented —
where data is missing you see a box saying so, never a stand-in.</div>
<div class="key" id="key"></div>
<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"></div>
<div class="bar">
 <input id="q" placeholder="search title, author, id…">
 <select id="cat"></select>
 <select id="tag"></select>
 <select id="ent"></select>
 <button class="clear" id="clear">clear all</button>
 <span class="chips" id="chips"></span>
 <span class="sub" id="count" style="margin-left:auto"></span>
</div>
</div></header>
<div class="wrap"><div id="view"></div></div>
<script>
const D = __DATA__, S = D.stats, B = D.blogs;
const V = {ok:['ok','DONE'], missing:['get','GO GET IT'], blocked:['dev','NEEDS DEV'],
           undecided:['you','NEEDS A DECISION'], skipped:['skip','SKIPPED']};
const HELP = {
 ok:'We have the data. Nothing to do.',
 missing:'Exists on aku.edu, not downloaded. Ours, and urgent.',
 blocked:'We have the data; Storyblok has no field for it. Dev only.',
 undecided:'We have it and somewhere to put it. Nobody has said how it should look.',
 skipped:'Deliberately dropped — the data exists nowhere.'
};
const esc = s => String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const q1 = s => String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const cls = st => (V[st]||V.ok)[0];
const lab = st => (V[st]||V.ok)[1];
B.forEach(b => { b.n = {}; for (const k in V) b.n[cls(k)] = b.bloks.filter(x=>x.state===k).length; });

const F = {verdict:'', stat:'', cat:'', tag:'', ent:'', q:''};

const STATS = [
 ['posts', ()=>S.blogs, '', ()=>true],
 ['banners', ()=>S.with_banner+'/'+S.blogs, S.with_banner<S.blogs?'warn':'good',
  b=>b.bloks.some(x=>x.component==='banner_image'&&x.state!=='ok'), 'no banner'],
 ['inline images', ()=>S.images_have+'/'+(S.images_have+S.images_missing), 'good',
  b=>b.bloks.some(x=>x.component==='image'), 'has inline images'],
 ['pull quotes', ()=>S.with_quote, '', b=>b.bloks.some(x=>x.component==='quote_banner'), 'has a quote'],
 ['categories', ()=>S.categories, '', b=>!b.category, 'no category'],
 ['tags', ()=>S.tags, '', b=>!b.tags.length, 'no tags'],
 ['entities', ()=>S.entities, '', ()=>true, ''],
 ['no folder', ()=>S.target_missing, S.target_missing?'bad':'good', b=>b.target_exists==='no', 'no folder']
];

const tally = f => { const m=new Map(); B.forEach(b=>f(b).forEach(v=>m.set(v,(m.get(v)||0)+1)));
                     return [...m].sort((a,b)=>b[1]-a[1]||String(a[0]).localeCompare(String(b[0]))); };
function options(id, items, label){
 document.getElementById(id).innerHTML = '<option value="">'+label+'</option>' +
  items.map(x=>'<option value="'+esc(x[0])+'">'+esc(x[0])+' ('+x[1]+')</option>').join('');
}
options('cat', tally(b=>b.category?[b.category]:[]), 'all categories');
options('tag', tally(b=>b.tags), 'all tags');
options('ent', tally(b=>b.entity?[b.entity]:[]), 'all entities');

function counts(){ const c={}; for(const k in V) c[cls(k)] = B.filter(b=>b.n[cls(k)]).length; return c; }

function renderChrome(){
 const c = counts();
 document.getElementById('key').innerHTML = Object.keys(V).map(k=>
  '<div class="k '+cls(k)+(F.verdict===k?' sel':'')+'" onclick="toggle(\'verdict\',\''+k+'\')">'
  +'<b>'+lab(k)+' <i>'+(c[cls(k)]||0)+'</i></b><span>'+HELP[k]+'</span></div>').join('');
 document.getElementById('stats').innerHTML = STATS.map((s,i)=>
  '<div class="stat '+s[2]+(F.stat===String(i)?' sel':'')+'" onclick="toggle(\'stat\',\''+i+'\')">'
  +'<b>'+s[1]()+'</b><span>'+s[0]+'</span></div>').join('');
 const chips=[];
 if(F.verdict) chips.push(['verdict','',lab(F.verdict)]);
 if(F.stat!=='') chips.push(['stat','',STATS[F.stat][4]||STATS[F.stat][0]]);
 if(F.cat) chips.push(['cat','category',F.cat]);
 if(F.tag) chips.push(['tag','tag',F.tag]);
 if(F.ent) chips.push(['ent','entity',F.ent]);
 document.getElementById('chips').innerHTML = chips.map(x=>
  '<span class="chip" onclick="clr(\''+x[0]+'\')">'+(x[1]?'<em>'+x[1]+'</em> ':'')+esc(x[2])+' ✕</span>').join('');
}
function toggle(k,v){ F[k] = (F[k]===String(v)) ? '' : String(v); render(); }
function clr(k){ F[k]=''; if(['cat','tag','ent'].includes(k)) document.getElementById(k).value=''; render(); }
function pickCat(v){ F.cat=v; document.getElementById('cat').value=v; render(); }
function pickTag(v){ F.tag=v; document.getElementById('tag').value=v; render(); }
function pickEnt(v){ F.ent=v; document.getElementById('ent').value=v; render(); }

function match(b){
 if(F.q && !((b.title+' '+b.author+' '+b.id).toLowerCase().includes(F.q))) return false;
 if(F.verdict && !b.n[cls(F.verdict)]) return false;
 if(F.stat!=='' && !STATS[F.stat][3](b)) return false;
 if(F.cat && b.category!==F.cat) return false;
 if(F.tag && !b.tags.includes(F.tag)) return false;
 if(F.ent && b.entity!==F.ent) return false;
 return true;
}
let cur = B[0] && B[0].id;
function renderList(){
 const rows=B.filter(match);
 document.getElementById('count').textContent = rows.length+' of '+B.length+' posts';
 if(rows.length && !rows.some(r=>r.id===cur)) cur = rows[0].id;
 document.getElementById('list').innerHTML = rows.length ? rows.map(function(b){
  return '<div class="row '+(b.id===cur?'on':'')+'" onclick="pick(\''+b.id+'\')">'
   +'<div class="t">'+esc(b.title)+'</div><div class="m"><span>#'+b.id+'</span>'
   +(b.category?'<span class="tag cat" onclick="event.stopPropagation();pickCat(\''+q1(b.category)+'\')">'+esc(b.category)+'</span>':'')
   +(b.n.get?'<span class="tag get">'+b.n.get+'</span>':'')
   +(b.n.dev?'<span class="tag dev">'+b.n.dev+'</span>':'')
   +(b.n.you?'<span class="tag you">'+b.n.you+'</span>':'')
   +'</div></div>';
 }).join('') : '<div class="empty">no post matches these filters</div>';
}
function renderPanel(){
 const b=B.find(x=>x.id===cur);
 if(!b){document.getElementById('panel').innerHTML='<div class="card"><div class="empty">nothing selected</div></div>';return;}
 const bloks=b.bloks.map(function(x){
  return '<div class="b '+cls(x.state)+'"><div><div class="name">'+esc(x.component)+'</div>'
   +'<div class="note">'+esc(x.note)+(x.extra?' <em>'+esc(x.extra)+'</em>':'')+'</div>'
   +(x.fix?'<div class="fix">'+esc(x.fix)+'</div>':'')
   +(x.warn?'<div class="fix">'+esc(x.warn)+'</div>':'')
   +'</div><div class="verdict">'+lab(x.state)+'</div></div>';
 }).join('');
 let prev='';
 for(const x of b.bloks){
  const c=cls(x.state);
  if(x.component==='banner_image')
   prev += x.state==='ok'
    ? '<figure class="banner"><img src="'+esc(x.img||'')+'" alt="" loading="lazy">'
      +'<figcaption style="color:var(--dim);font-size:11px;text-align:center">'+esc(x.note)+'</figcaption></figure>'
    : '<div class="gap '+c+'"><b>'+lab(x.state)+' — banner</b><span>'+esc(x.note)+'</span><span>'+esc(x.fix)+'</span></div>';
  else if(x.component==='rich_text') prev+='<div class="prev">'+(x.html||'')+'</div>';
  else if(x.component==='quote_banner')
   prev+='<div class="quote">'+esc(x.note)+'<span class="att">'+esc(x.extra||'no attribution in the export')+'</span></div>';
  else if(x.component==='media_section' && x.embed){
   // a YouTube watch/embed URL either way -> the embeddable form
   const id=(x.embed.match(/(?:embed\/|v=|youtu\.be\/)([\w-]{6,})/)||[])[1];
   prev += id ? '<div class="vid"><iframe src="https://www.youtube.com/embed/'+id
     +'" allowfullscreen loading="lazy"></iframe></div>'
    : '<div class="hero">video · '+esc(x.embed)+'</div>';
  }
  else if(x.component==='iframe' && x.raw){
   // the export stores the publisher's own embed markup; show it as given
   prev += '<div class="embed">'+x.raw+'</div>';
  }
  else if(x.state!=='ok')
   prev+='<div class="gap '+c+'"><b>'+lab(x.state)+' — '+esc(x.component)+'</b><span>'+esc(x.note)+'</span><span>'+esc(x.fix)+'</span></div>';
  else prev+='<div class="hero">'+esc(x.component)+' · '+esc(x.note)+'</div>';
 }
 const tagHtml = b.tags.length
  ? b.tags.map(t=>'<span class="lk" onclick="pickTag(\''+q1(t)+'\')">'+esc(t)+'</span>').join(' · ')
  : '<span style="color:var(--dim)">none</span>';
 document.getElementById('panel').innerHTML =
  '<div class="card"><h2>'+esc(b.title)+'</h2><div class="meta">#'+b.id+' · '
  +esc(b.author||'no author')+' · '+esc(b.date||'no date')
  +'<br>entity <code class="lk" onclick="pickEnt(\''+q1(b.entity)+'\')">'+esc(b.entity||'—')+'</code>'
  +' · category <code class="lk" onclick="pickCat(\''+q1(b.category)+'\')">'+esc(b.category||'—')+'</code>'
  +'<br>lands in <code>'+esc(b.target||'unresolved')+'</code>'
  +(b.target_exists==='no'?' <span class="tag dev">folder missing</span>':'')
  +(b.share_entity?'<br>shared to entity <code>'+esc(b.share_entity)+'</code>':'')
  +'<br>tags · '+tagHtml
  +'</div><h3>every block, and whether we can fill it</h3>'+bloks+'</div>'
  +'<div class="card"><h3>what it will look like</h3>'+prev+'</div>';
}
// ------------------------------------------------------- the three views
let VIEW = 'archive';
const TABS = [['archive','Archive'],['story','Story'],['tax','Categories, tags & entities']];

function renderTabs(){
 document.getElementById('tabs').innerHTML = TABS.map(t =>
  '<div class="tab'+(VIEW===t[0]?' on':'')+'" onclick="go(\'' + t[0] + '\')">'+t[1]+'</div>').join('');
}
function go(v){ VIEW=v; render(); window.scrollTo({top:0}); }

// thumbnail for a card: the banner if we have the file
function thumb(b){
 const bn = b.bloks.find(x=>x.component==='banner_image' && x.img);
 return bn ? '<img src="'+esc(bn.img)+'" alt="" loading="lazy">'
           : '<span>no banner</span>';
}

function renderArchive(){
 const rows = B.filter(match);
 document.getElementById('count').textContent = rows.length+' of '+B.length+' posts';
 document.getElementById('view').innerHTML = rows.length
  ? '<div class="grid">'+rows.map(function(b){
     return '<div class="gc" onclick="open1(\'' + b.id + '\')">'
      +'<div class="thumb">'+thumb(b)+'</div><div class="body">'
      +'<div class="ti">'+esc(b.title)+'</div>'
      +'<div class="mm"><span>#'+b.id+'</span>'
      +(b.category?'<span class="tag cat">'+esc(b.category)+'</span>':'')
      +(b.n.get?'<span class="tag get">'+b.n.get+' get</span>':'')
      +(b.n.dev?'<span class="tag dev">'+b.n.dev+' dev</span>':'')
      +'</div></div></div>';
    }).join('')+'</div>'
  : '<div class="empty">no post matches these filters</div>';
}

function open1(id){ cur=id; VIEW='story'; render(); window.scrollTo({top:0}); }

function renderStory(){
 const rows = B.filter(match);
 document.getElementById('count').textContent = rows.length+' of '+B.length+' posts';
 if(rows.length && !rows.some(r=>r.id===cur)) cur = rows[0].id;
 document.getElementById('view').innerHTML =
  '<div class="layout"><div class="list" id="list"></div><div class="panel" id="panel"></div></div>';
 renderList(); renderPanel();
}

// ------------------------------------- a browsable list of every value
function renderTax(){
 const cats = tally(b=>b.category?[b.category]:[]);
 const tags = tally(b=>b.tags);
 const ents = tally(b=>b.entity?[b.entity]:[]);
 const owner = {};
 B.forEach(b=>{ if(b.category) (owner[b.category]=owner[b.category]||new Set()).add(b.entity); });
 const line = (v,n,pick,sel,who) =>
  '<div class="tl'+(sel?' sel':'')+'" onclick="'+pick+'"><b>'+esc(v)+
  (who?'<span class="who">'+esc(who)+'</span>':'')+'</b><i>'+n+'</i></div>';
 document.getElementById('count').textContent =
  cats.length+' categories · '+tags.length+' tags · '+ents.length+' entities';
 document.getElementById('view').innerHTML = '<div class="taxwrap">'
  +'<div class="taxcard"><h3>categories — '+cats.length+'</h3>'
  + cats.map(x=>line(x[0],x[1],"pickCat('"+q1(x[0])+"');go('archive')",F.cat===x[0],
      [...(owner[x[0]]||[])].join(' · '))).join('')+'</div>'
  +'<div class="taxcard"><h3>tags — '+tags.length+'</h3>'
  + tags.map(x=>line(x[0],x[1],"pickTag('"+q1(x[0])+"');go('archive')",F.tag===x[0],'')).join('')+'</div>'
  +'<div class="taxcard"><h3>entities — '+ents.length+'</h3>'
  + ents.map(x=>line(x[0],x[1],"pickEnt('"+q1(x[0])+"');go('archive')",F.ent===x[0],'')).join('')+'</div>'
  +'</div>';
}

function render(){
 renderTabs(); renderChrome();
 if(VIEW==='archive') renderArchive();
 else if(VIEW==='tax') renderTax();
 else renderStory();
}
function pick(id){ cur=id; renderList(); renderPanel(); }

document.getElementById('q').oninput = e => { F.q = e.target.value.toLowerCase().trim(); render(); };
document.getElementById('cat').onchange = e => { F.cat = e.target.value; render(); };
document.getElementById('tag').onchange = e => { F.tag = e.target.value; render(); };
document.getElementById('ent').onchange = e => { F.ent = e.target.value; render(); };
document.getElementById('clear').onclick = () => {
 for (const k in F) F[k] = '';
 document.getElementById('q').value = '';
 ['cat','tag','ent'].forEach(i => document.getElementById(i).value = '');
 render();
};
render();
</script></body></html>
